name: Container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: lowpass-variants:test
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}

      - name: Check runtime tools
        run: |
          set -Eeuo pipefail
          docker run --rm lowpass-variants:test bash -c '
            gatk --version
            samtools --version | head -1
            bcftools --version | head -1
            freebayes --version
            nextflow -version
            docker --version
            ./bin/run_pipeline.sh --help >/dev/null
          '

      - name: Run one-variant fresh quickstart
        run: |
          set -Eeuo pipefail
          docker run --rm lowpass-variants:test bash -c '
            OUTDIR=/tmp/results NEXTFLOW_PROFILE= bash examples/run_minimal_fresh.sh
            test -s /tmp/results/final_vcf/SAMPLE.final_variants.vcf.gz.tbi
            actual="$(bcftools query -f "%CHROM\t%POS\t%REF\t%ALT\t%INFO/DECISION\t%INFO/VOTE_COUNT\n" /tmp/results/final_vcf/SAMPLE.final_variants.vcf.gz)"
            test "$actual" = "$(printf "chr1\t25\tA\tC\tHIGH_CONFIDENCE\t2")"
          '

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}

      - name: Inspect published digest
        run: docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}'
