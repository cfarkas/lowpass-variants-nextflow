name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bcftools samtools tabix curl

      - name: Install current stable Nextflow
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL https://get.nextflow.io | bash
          install -m 0755 nextflow "${HOME}/.local/bin/nextflow"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/nextflow" -version

      - name: Restore executable permissions defensively
        run: |
          find bin examples tests -type f -name '*.sh' -exec chmod +x {} +
          chmod +x install_nextflow.sh run_example.sh tests/fixtures/nextflow

      - name: Check Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find bin examples tests -type f -name '*.sh' -print0 |
            xargs -0 -r bash -n
          bash -n install_nextflow.sh run_example.sh tests/fixtures/nextflow

      - name: Check Python syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = sorted(Path("bin").glob("*.py"))
          if not paths:
              raise SystemExit("no Python entry points found under bin/")
          for path in paths:
              compile(path.read_bytes(), str(path), "exec")
              print(f"syntax ok: {path}")
          PY

      - name: Lint Nextflow with syntax parser v2
        env:
          NXF_SYNTAX_PARSER: v2
        run: nextflow lint .

      # This aggregate suite is limited to static fixtures and synthetic unit
      # tests. It must not launch FFPErase or fetch its models/container.
      - name: Run aggregate test suite
        run: tests/run_all.sh
